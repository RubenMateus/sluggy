name: Latest

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test Sluggy
        run: dotnet test Sluggy.Tests/Sluggy.Tests.csproj --no-restore
      - name: Test SluggyUnidecode
        run: dotnet test SluggyUnidecode.Tests/SluggyUnidecode.Tests.csproj --no-restore

  semantic-release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
      release_version: ${{ steps.release_version.outputs.release_version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release version
        id: release_version
        run: |
          if [ -n "$new_release_version" ]; then
            echo "release_version=$new_release_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t release_tags < <(git tag --points-at HEAD --list 'v*-sluggy')
          if [ "${#release_tags[@]}" -gt 1 ]; then
            echo "Expected at most one semantic-release tag on HEAD, found: ${release_tags[*]}" >&2
            exit 1
          fi

          if [ "${#release_tags[@]}" -eq 1 ]; then
            release_version="${release_tags[0]#v}"
            release_version="${release_version%-sluggy}"
            echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          fi
        env:
          new_release_version: ${{ steps.release.outputs.new_release_version }}

  publish:
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.release_version != ''
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Generate nuget package Sluggy
        run: dotnet pack --configuration Release -o nupkg /p:Version="$release_version" /p:AssemblyVersion="$release_version.0" /p:FileVersion="$release_version.0"
        env:
          release_version: ${{ needs.semantic-release.outputs.release_version }}
        working-directory: ./Sluggy/
      - name: Publish Sluggy to NuGet
        run: find . -type f -name '*.nupkg' -print0 | xargs -0 -I pkg dotnet nuget push pkg -k "$nuget_api_key" -s "https://api.nuget.org/v3/index.json" --skip-duplicate
        env:
          nuget_api_key: ${{ secrets.NUGET_API_KEY }}
        working-directory: ./Sluggy/nupkg
      - name: Publish Sluggy to GitHub Packages
        run: find . -type f -name '*.nupkg' -print0 | xargs -0 -I pkg dotnet nuget push pkg -k "$github_token" -s "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
        env:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./Sluggy/nupkg

      - name: Generate nuget package SluggyUnidecode
        run: dotnet pack --configuration Release -o nupkg /p:Version="$release_version" /p:AssemblyVersion="$release_version.0" /p:FileVersion="$release_version.0"
        env:
          release_version: ${{ needs.semantic-release.outputs.release_version }}
        working-directory: ./SluggyUnidecode/
      - name: Publish SluggyUnidecode to NuGet
        run: find . -type f -name '*.nupkg' -print0 | xargs -0 -I pkg dotnet nuget push pkg -k "$nuget_api_key" -s "https://api.nuget.org/v3/index.json" --skip-duplicate
        env:
          nuget_api_key: ${{ secrets.NUGET_API_KEY }}
        working-directory: ./SluggyUnidecode/nupkg
      - name: Publish SluggyUnidecode to GitHub Packages
        run: find . -type f -name '*.nupkg' -print0 | xargs -0 -I pkg dotnet nuget push pkg -k "$github_token" -s "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
        env:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./SluggyUnidecode/nupkg
