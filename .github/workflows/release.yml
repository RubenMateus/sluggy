name: Latest

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize releases so two quick merges can't race on tags or NuGet pushes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test Sluggy
        run: dotnet test Sluggy.Tests/Sluggy.Tests.csproj --no-restore
      - name: Test SluggyUnidecode
        run: dotnet test SluggyUnidecode.Tests/SluggyUnidecode.Tests.csproj --no-restore

  semantic-release-sluggy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
      release_version: ${{ steps.release_version.outputs.release_version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Sluggy release baseline
        # Without a reachable tag semantic-release would restart at 1.0.0, which is already on NuGet.
        run: git tag --merged HEAD --list 'sluggy-*' | grep -q .
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release version
        id: release_version
        run: |
          if [ -n "$new_release_version" ]; then
            echo "release_version=$new_release_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t release_tags < <(git tag --points-at HEAD --list 'sluggy-*')
          if [ "${#release_tags[@]}" -gt 1 ]; then
            echo "Expected at most one semantic-release tag on HEAD, found: ${release_tags[*]}" >&2
            exit 1
          fi

          if [ "${#release_tags[@]}" -eq 1 ]; then
            release_version="${release_tags[0]#sluggy-}"
            echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          fi
        env:
          new_release_version: ${{ steps.release.outputs.new_release_version }}

  semantic-release-unidecode:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
      release_version: ${{ steps.release_version.outputs.release_version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify SluggyUnidecode release baseline
        # Without a reachable tag semantic-release would restart at 1.0.0, which is already on NuGet.
        run: git tag --merged HEAD --list 'sluggyUnidecode-*' | grep -q .
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Select SluggyUnidecode release configuration
        run: cp .releaserc-unidecode.json .releaserc.json
      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release version
        id: release_version
        run: |
          if [ -n "$new_release_version" ]; then
            echo "release_version=$new_release_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t release_tags < <(git tag --points-at HEAD --list 'sluggyUnidecode-*')
          if [ "${#release_tags[@]}" -gt 1 ]; then
            echo "Expected at most one semantic-release tag on HEAD, found: ${release_tags[*]}" >&2
            exit 1
          fi

          if [ "${#release_tags[@]}" -eq 1 ]; then
            release_version="${release_tags[0]#sluggyUnidecode-}"
            echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          fi
        env:
          new_release_version: ${{ steps.release.outputs.new_release_version }}

  publish:
    runs-on: ubuntu-latest
    needs: [semantic-release-sluggy, semantic-release-unidecode]
    if: needs.semantic-release-sluggy.outputs.release_version != '' || needs.semantic-release-unidecode.outputs.release_version != ''
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Generate nuget package Sluggy
        if: needs.semantic-release-sluggy.outputs.release_version != ''
        run: dotnet pack --configuration Release -o nupkg /p:SluggyVersion="$release_version"
        env:
          release_version: ${{ needs.semantic-release-sluggy.outputs.release_version }}
        working-directory: ./Sluggy/
      - name: Publish Sluggy to NuGet
        if: needs.semantic-release-sluggy.outputs.release_version != ''
        run: find . -type f -name '*.nupkg' -print0 | xargs -0 -n 1 dotnet nuget push -k "$nuget_api_key" -s "https://api.nuget.org/v3/index.json" --skip-duplicate
        env:
          nuget_api_key: ${{ secrets.NUGET_API_KEY }}
        working-directory: ./Sluggy/nupkg
      - name: Publish Sluggy to GitHub Packages
        if: needs.semantic-release-sluggy.outputs.release_version != ''
        run: find . -type f -name '*.nupkg' -print0 | xargs -0 -n 1 dotnet nuget push -k "$github_token" -s "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
        env:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./Sluggy/nupkg

      - name: Resolve Sluggy dependency version
        id: sluggy_dependency
        if: needs.semantic-release-unidecode.outputs.release_version != ''
        run: |
          if [ -z "$sluggy_version" ]; then
            sluggy_tag="$(git tag --merged HEAD --list 'sluggy-*' --sort=-v:refname | head -n 1)"
            sluggy_version="${sluggy_tag#sluggy-}"
          fi
          if [ -z "$sluggy_version" ]; then
            echo "Could not resolve the Sluggy version for the SluggyUnidecode dependency" >&2
            exit 1
          fi
          echo "version=$sluggy_version" >> "$GITHUB_OUTPUT"
        env:
          sluggy_version: ${{ needs.semantic-release-sluggy.outputs.release_version }}
      - name: Generate nuget package SluggyUnidecode
        if: needs.semantic-release-unidecode.outputs.release_version != ''
        run: dotnet pack --configuration Release -o nupkg /p:SluggyUnidecodeVersion="$release_version" /p:SluggyVersion="$sluggy_version"
        env:
          release_version: ${{ needs.semantic-release-unidecode.outputs.release_version }}
          sluggy_version: ${{ steps.sluggy_dependency.outputs.version }}
        working-directory: ./SluggyUnidecode/
      - name: Publish SluggyUnidecode to NuGet
        if: needs.semantic-release-unidecode.outputs.release_version != ''
        run: find . -type f -name '*.nupkg' -print0 | xargs -0 -n 1 dotnet nuget push -k "$nuget_api_key" -s "https://api.nuget.org/v3/index.json" --skip-duplicate
        env:
          nuget_api_key: ${{ secrets.NUGET_API_KEY }}
        working-directory: ./SluggyUnidecode/nupkg
      - name: Publish SluggyUnidecode to GitHub Packages
        if: needs.semantic-release-unidecode.outputs.release_version != ''
        run: find . -type f -name '*.nupkg' -print0 | xargs -0 -n 1 dotnet nuget push -k "$github_token" -s "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
        env:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./SluggyUnidecode/nupkg
